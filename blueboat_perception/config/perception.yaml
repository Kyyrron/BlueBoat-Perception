# BlueBoat-Perception node defaults (docs/topics.md §6). The launch file
# passes mode / dataset_name / world_dir / data_dir on top of these.
perception:
  ros__parameters:
    record_log: true          # <root>/data/Perception_data/live/<stream_id>.jsonl
    join_timeout_s: 5.0       # release an incomplete image key after this
    # Detector: dummy_center (the station's former in-process dummy, default) or
    # yolo (Ultralytics weights in detector_model; README "Switching the detector").
    detector: dummy_center
    # --- yolo only (core/detectors/yolo.py, docs/DESIGN.md §4.4) ---
    detector_model: ""                 # weights file, e.g. <root>/data/Perception_models/<name>/weights/best.pt
    detector_device: cpu               # cpu (reproducible) | cuda:0
    detector_tiling: tiles             # tiles (256 x 256 across track) | full (squeeze baseline)
    tile_size: 256                     # px, native resolution, never resized
    tile_stride: 128                   # px (50 % overlap); 64 is the comparison arm
    tile_min_valid_fraction: 0.001     # skip a tile only when essentially empty (counted)
    detector_input_size: 0             # 0 = 256 for tiles, 640 for full
    detector_score_threshold: 0.01     # low on purpose: the cut belongs to calibration / Belief
    detector_nms_iou: 0.7              # Ultralytics' in-tile NMS
    merge: nms                         # nms | greedy_nmm (merging the overlapping tiles' boxes)
    merge_threshold: 0.5               # IoU (nms) or intersection-over-smaller (greedy_nmm)
    detector_max_det_tile: 300
    # Only detections with confidence >= this go on the GCS map (/sss_ai/detections);
    # the records keep every detection (owner, 2026-10-23).
    map_min_confidence: 0.10
    # Detector input (PREPROCESSING_STUDY.md §6): fixed_gray = one fixed mapping of
    # the raw dB (decision 6.4, parameters in core/data/<mapping>.json, fitted on
    # real data); identity = the GCS display PNG as is (the baseline).
    preprocess: fixed_gray
    detector_input_mapping: fixed_gray_v1
    near_range_mask_m: 0.0    # decision 6.5: 0.0 (off) or 0.75 (the GCS live nadir blank)
    turn_window_s: 1.0        # decision 6.2: yaw-rate smoothing for the turn flags
    # Dataset mode in a simulator world (world_dir set): YOLO labels from the
    # simulator's ground truth, highlight + shadow (core/sim_labels.py). The
    # ground truth feeds the label writer only, never the detections or records.
    label_source: auto        # auto = simulator ground truth when a world is given; none = empty labels
    label_min_rows: 3         # a box needs this many picture rows
    label_wait_s: 3.0         # wait at most this long for a picture's ground truth
    calibration: identity
    # Localisation uncertainty (model geometric_v1) -- ASSUMED, not measured:
    sigma_h_m: 0.10
    sigma_heading_deg: 2.0
    sigma_nav_m: 1.0
    footprint_row_step: 16
